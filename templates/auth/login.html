<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/dist/style.css">
</head>
<body class="bg-grey-blue text-white center">

    <!-- Login Form Container -->
    <div class="bg-light-green p-8 rounded-lg shadow-lg mt-8 max-w-md w-full">
        <h1 class="text-3xl font-bold text-center mb-6">Login</h1>
        <form id="loginForm" class="space-y-4">
            
            <!-- Email -->
            <div>
                <label for="email" class="block text-lg font-medium">Email:</label>
                <input type="email" id="email" required class="my-custom-class">
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-lg font-medium">Password:</label>
                <input type="password" id="password" required class="my-custom-class">
            </div>

            <!-- Submit Button -->
            <div class="mt-6 text-center">
                <button type="submit" class="bg-grey-blue text-white px-6 py-2 rounded-lg">Login</button>
            </div>
        </form>

        <!-- Link to Register -->
        <div class="mt-4 text-center">
            <a href="/templates/auth/register.html" class="text-light-green">Don't have an account? Register</a>
        </div>
    </div>

    <script type="module" src="/js/auth/login.js"></script>
</body>
</html>
