<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <!-- Link to Tailwind CSS (compiled output in /dist/style.css) -->
    <link rel="stylesheet" href="/dist/style.css">
    <!-- JavaScript file (make sure this path is correct) -->
    <script defer type="module" src="/js/auth/register.js"></script>
</head>
<body class="bg-grey-blue text-white center">

    <!-- Registration Form Container -->
    <div class="bg-light-green p-8 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-3xl font-bold text-center mb-6">Register</h1>
        
        <form id="registration-form" class="space-y-4">
            
            <!-- Username Field -->
            <div>
                <label for="name" class="block text-lg font-medium">Username:</label>
                <input type="text" id="name" required class="my-custom-class">
            </div>

            <!-- Email Field -->
            <div>
                <label for="email" class="block text-lg font-medium">Email:</label>
                <input type="email" id="email" required class="my-custom-class">
            </div>

            <!-- Password Field -->
            <div>
                <label for="password" class="block text-lg font-medium">Password:</label>
                <input type="password" id="password" required class="my-custom-class">
            </div>

            <!-- Bio Field (Optional) -->
            <div>
                <label for="bio" class="block text-lg font-medium">Bio (optional):</label>
                <input type="text" id="bio" class="my-custom-class">
            </div>

            <!-- Avatar URL Field (Optional) -->
            <div>
                <label for="avatarUrl" class="block text-lg font-medium">Avatar URL (optional):</label>
                <input type="url" id="avatarUrl" class="my-custom-class">
            </div>

            <!-- Avatar Alt Text Field (Optional) -->
            <div>
                <label for="avatarAlt" class="block text-lg font-medium">Avatar Alt Text (optional):</label>
                <input type="text" id="avatarAlt" class="my-custom-class">
            </div>

            <!-- Banner URL Field (Optional) -->
            <div>
                <label for="bannerUrl" class="block text-lg font-medium">Banner URL (optional):</label>
                <input type="url" id="bannerUrl" class="my-custom-class">
            </div>

            <!-- Banner Alt Text Field (Optional) -->
            <div>
                <label for="bannerAlt" class="block text-lg font-medium">Banner Alt Text (optional):</label>
                <input type="text" id="bannerAlt" class="my-custom-class">
            </div>

            <!-- Venue Manager Checkbox -->
            <div class="flex items-center">
                <input type="checkbox" id="venueManager" class="mr-2">
                <label for="venueManager" class="text-lg font-medium">Venue Manager</label>
            </div>

            <!-- Submit Button -->
            <div class="mt-6 text-center">
                <button type="submit" class="bg-grey-blue text-white px-6 py-2 rounded-lg hover:bg-gray-700">Register</button>
            </div>
        </form>

        <!-- Link to Login -->
        <div class="mt-4 text-center">
            <a href="/templates/auth/login.html" class="text-white underline">Already have an account? Login</a>
        </div>
    </div>

</body>
</html>
