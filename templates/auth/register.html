<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Registration</title>
    <link rel="stylesheet" href="/dist/style.css" />
    <script defer type="module" src="/js/auth/register.js"></script>
    <script defer type="module" src="/js/utils/utils.js"></script>
  </head>
  <body class="bg-grey-blue text-white">
    <header class="header bg-light-green text-white p-4">
      <a href="/index.html" class="text-2xl font-bold">Home</a>
      <!-- Hamburger Icon (Hidden on larger screens) -->
      <div class="lg:hidden flex items-center">
        <button id="hamburger-icon" class="text-white p-2">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            class="w-6 h-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            ></path>
          </svg>
        </button>
      </div>
      <!-- Navbar Links (Visible on larger screens) -->
      <div class="hidden lg:flex space-x-6">
        <a
          href="/templates/posts/postFollow.html"
          class="hover:bg-green-300 px-3 py-2 rounded"
          >Followers Post</a
        >
        <a
          href="/templates/user/profile.html"
          class="hover:bg-green-300 px-3 py-2 rounded"
          >My Profile</a
        >
        <a
          href="/templates/auth/login.html"
          class="hover:bg-green-300 px-3 py-2 rounded"
          >Login</a
        >
        <a
          href="/templates/auth/register.html"
          class="hover:bg-green-300 px-3 py-2 rounded"
          >Register</a
        >
        <button id="logoutButton" class="hover:bg-green-300 px-3 py-2 rounded">
          Logout
        </button>
      </div>
      <!-- Mobile Menu (Hidden by default) -->
      <div
        id="mobile-menu"
        class="lg:hidden hidden bg-light-green text-white space-y-4 p-4 absolute top-16 left-0 w-full"
      >
        <a
          href="/templates/posts/postFollow.html"
          class="block px-3 py-2 rounded"
          >Followers Post</a
        >
        <a href="/templates/user/profile.html" class="block px-3 py-2 rounded"
          >My Profile</a
        >
        <a href="/templates/auth/login.html" class="block px-3 py-2 rounded"
          >Login</a
        >
        <a href="/templates/auth/register.html" class="block px-3 py-2 rounded"
          >Register</a
        >
        <button id="logoutButton" class="block px-3 py-2 rounded">
          Logout
        </button>
      </div>
    </header>
    <!-- Registration Form Container -->
    <div class="flex justify-center p-8">
      <div class="bg-light-green p-8 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-3xl font-bold text-center mb-6">Register</h1>

        <form id="registration-form" class="space-y-4">
          <!-- Username Field -->
          <div>
            <label for="name" class="block text-lg font-medium"
              >Username:</label
            >
            <input type="text" id="name" required class="input-field-reg" />
          </div>
          <!-- Email Field -->
          <div>
            <label for="email" class="block text-lg font-medium">Email:</label>
            <input type="email" id="email" required class="input-field-reg" />
          </div>
          <!-- Password Field -->
          <div>
            <label for="password" class="block text-lg font-medium"
              >Password:</label
            >
            <input
              type="password"
              id="password"
              required
              class="input-field-reg"
            />
          </div>
          <!-- Bio Field (Optional) -->
          <div>
            <label for="bio" class="block text-lg font-medium"
              >Bio (optional):</label
            >
            <input type="text" id="bio" class="input-field-reg" />
          </div>
          <!-- Avatar URL Field (Optional) -->
          <div>
            <label for="avatarUrl" class="block text-lg font-medium"
              >Avatar URL (optional):</label
            >
            <input type="url" id="avatarUrl" class="input-field-reg" />
          </div>
          <!-- Avatar Alt Text Field (Optional) -->
          <div>
            <label for="avatarAlt" class="block text-lg font-medium"
              >Avatar Alt Text (optional):</label
            >
            <input type="text" id="avatarAlt" class="input-field-reg" />
          </div>
          <!-- Banner URL Field (Optional) -->
          <div>
            <label for="bannerUrl" class="block text-lg font-medium"
              >Banner URL (optional):</label
            >
            <input type="url" id="bannerUrl" class="input-field-reg" />
          </div>
          <!-- Banner Alt Text Field (Optional) -->
          <div>
            <label for="bannerAlt" class="block text-lg font-medium"
              >Banner Alt Text (optional):</label
            >
            <input type="text" id="bannerAlt" class="input-field-reg" />
          </div>
          <!-- Submit Button -->
          <div class="mt-6 text-center">
            <button
              type="submit"
              class="bg-grey-blue text-white px-6 py-2 rounded-lg hover:bg-gray-700"
            >
              Register
            </button>
          </div>
        </form>
        <!-- Link to Login -->
        <div class="mt-4 text-center">
          <a href="/templates/auth/login.html" class="text-white underline"
            >Already have an account? Login</a
          >
        </div>
      </div>
    </div>
  </body>
</html>
